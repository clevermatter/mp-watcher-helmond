name: Marktplaats-watcher

on:
  schedule:
    # Elke 30 minuten (op :00 en :30). Tijden zijn in UTC; GitHub start
    # geplande runs soms een paar minuten later dan gepland. De nachtpauze
    # (Nederlandse tijd) staat in zoekopdrachten.toml.
    - cron: "0,30 * * * *"
  # Hiermee kun je hem ook met de hand starten via de Actions-tab
  workflow_dispatch:
    inputs:
      voorbeeld:
        description: "Stuur ook een testbericht met de nieuwste advertenties"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om gezien.json op te slaan

concurrency:
  group: marktplaats-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Nieuwe advertenties zoeken
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOMATISCH: ${{ github.event_name == 'schedule' }}
          VOORBEELD: ${{ inputs.voorbeeld }}
        run: python3 marktplaats_watcher.py

      - name: Onthouden wat al gemeld is
        if: success() || failure()
        run: |
          git config user.name "marktplaats-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gezien.json
          if git diff --cached --quiet; then
            echo "Niets nieuws om op te slaan."
          else
            git commit -m "Gezien bijgewerkt"
            git pull --rebase --quiet
            git push
          fi
